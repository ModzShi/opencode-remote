name: Build iOS IPA

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build IPA (${{ github.event.inputs.profile || 'preview' }})
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS
        run: |
          eas build:configure --platform ios --non-interactive || true

      - name: Build IPA
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build
        run: |
          eas build:list --platform ios --limit 1 --json > build.json
          BUILD_ID=$(cat build.json | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          eas build:wait --id $BUILD_ID
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download artifact
        run: |
          eas build:list --platform ios --limit 1 --json > build.json
          BUILD_ID=$(cat build.json | jq -r '.[0].id')
          ARTIFACT_URL=$(cat build.json | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.ipaUrl')
          echo "Downloading from: $ARTIFACT_URL"
          curl -L -o opencode-remote.ipa "$ARTIFACT_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-ipa
          path: opencode-remote.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: opencode-remote.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Alternative: Build with Expo Application Services (EAS) directly
  build-eas:
    name: Build with EAS
    runs-on: macos-latest
    timeout-minutes: 60
    if: false  # Set to true to use EAS directly instead of above
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform ios --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}