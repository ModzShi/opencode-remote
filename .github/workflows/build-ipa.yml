name: Build iOS IPA

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned IPA with xcodebuild
        run: |
          set -uo pipefail
          cd ios

          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | jq -r '.project.schemes[0]')
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
            SCHEME="${WORKSPACE%.xcworkspace}"
          fi
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"
          if [ -z "$SCHEME" ]; then echo "No scheme found"; exit 1; fi

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive > build.log 2>&1
          XC_STATUS=$?
          set -e

          if [ $XC_STATUS -ne 0 ]; then
            echo "xcodebuild failed with exit code $XC_STATUS"
            echo "----- ERROR LINES -----"
            grep -n -i "error:" build.log | tail -40 || true
            FIRST_ERROR=$(grep -i -m1 "error:" build.log || true)
            SECOND_ERROR=$(grep -i "error:" build.log | sed -n '2p' || true)
            if [ -n "$FIRST_ERROR" ]; then
              echo "::error title=Xcode error 1::${FIRST_ERROR}"
            fi
            if [ -n "$SECOND_ERROR" ]; then
              echo "::error title=Xcode error 2::${SECOND_ERROR}"
            fi
            echo "----- LAST 120 LINES -----"
            tail -120 build.log
            exit 1
          fi

          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App not in Products/Applications, searching archive..."
            APP_PATH=$(find build/App.xcarchive -maxdepth 4 -name "*.app" 2>/dev/null | head -n 1)
          fi
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "No .app produced by archive"; exit 1; fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q opencode-remote-unsigned.ipa Payload
          echo "IPA size:"
          ls -lh opencode-remote-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-ipa
          path: ios/opencode-remote-unsigned.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/opencode-remote-unsigned.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
